
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <div class="header-content">
            <h1>Expense Tracker</h1>
            <p>Manage and track your daily expenses</p>
        </div>
    </header>

    <main class="container">

        <section class="form-card">
            <div class="section-heading">
                <h2 id="formHeading">Add New Expense</h2>
                <p>Enter the details of your expense below.</p>
            </div>

            <form id="expenseForm">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="title">Expense Title</label>
                        <input type="text" id="title" name="title"
                               placeholder="e.g. Lunch" required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" name="amount"
                               min="0.01" step="0.01"
                               placeholder="e.g. 250" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" name="category" required>
                            <option value="">Select category</option>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Health">Health</option>
                            <option value="Education">Education</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="expense_date">Expense Date</label>
                        <input type="date" id="expense_date"
                               name="expense_date" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="description">Description</label>
                        <textarea id="description" name="description"
                                  rows="3"
                                  placeholder="Optional details about this expense"></textarea>
                    </div>

                </div>

                <div class="form-actions">
                    <button type="submit" id="submitButton"
                            class="btn-primary">
                        Add Expense
                    </button>

                    <button type="button" id="cancelEditButton"
                            class="btn-secondary" hidden>
                        Cancel Edit
                    </button>
                </div>

                <p id="message" role="status"
                   aria-live="polite"></p>

            </form>
        </section>

        <section class="history-card">

            <div class="section-heading">
                <h2>Expense History</h2>
                <p>Your recorded expenses appear below.</p>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="expenseTableBody">
                        <tr>
                            <td colspan="7" class="empty-state">
                                Loading expenses...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </section>

    </main>

    <footer>
        <p>Expense Tracker · AWS Three-Tier Application</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
