<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Management System</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>Expense Management System</h1>
        <p>Track and manage your daily expenses</p>
    </header>

    <main class="container">
        <section class="expense-form">
            <h2>Add New Expense</h2>
            <form id="expenseForm">
                <input type="text" id="title" placeholder="Expense Title" maxlength="150" required>
                <input type="number" id="amount" placeholder="Amount" min="0.01" step="0.01" required>
                <input type="text" id="category" placeholder="Category" maxlength="100" required>
                <input type="date" id="expense_date" required>
                <textarea id="description" placeholder="Description (Optional)"></textarea>
                <button type="submit">Add Expense</button>
            </form>
            <p id="message"></p>
        </section>

        <section class="expense-list">
            <h2>Expense History</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Expense Date</th>
                    </tr>
                </thead>
                <tbody id="expenseTableBody"></tbody>
            </table>
        </section>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
